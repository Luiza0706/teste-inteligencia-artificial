<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Segredo da Família</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <div class="frame">
      <header class="header">
        <div class="trophy">🏆</div>
        <h1 id="title">O SEGREDO DA FAMÍLIA</h1>
        <p class="subtitle">Uma aventura interativa · Imersão IA Alura</p>
      </header>

      <main class="content" id="content">
        <p id="narrative" class="narrative"></p>

        <div class="image-container">
          <img id="story-image" src="" alt="Cena da história" />
        </div>

        <p id="scene-text" class="scene-text"></p>

        <div id="choices" class="choices"></div>
      </main>

      <footer class="footer">
        <div class="restart-container">
          <button id="global-restart-btn" class="global-restart-btn" type="button">🔄 Recomeçar História</button>
        </div>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
